name: Bug report
about: Report a reproducible problem in SolKraft
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove API keys, private skill content, and local file paths before posting.
  - type: input
    id: version
    attributes:
      label: SolKraft version or commit
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use synthetic skills and remove secrets or private data.
