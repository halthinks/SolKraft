name: Skill pack proposal
about: Propose a first-party skill or a documented external skill integration
labels: [skills]
body:
  - type: input
    id: name
    attributes:
      label: Proposed skill ID
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: What work does it improve?
    validations:
      required: true
  - type: input
    id: provenance
    attributes:
      label: Author or upstream source URL
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License and redistribution terms
    validations:
      required: true
  - type: textarea
    id: routing
    attributes:
      label: Positive and negative routing examples
    validations:
      required: true
