name: Skill Instruction Integrity

on:
  push:
    branches: [main]
    paths:
      - "solkraft/skillpacks/**"
      - "scripts/audit_skill_instructions.py"
      - "tests/test_skill_instruction_integrity.py"
      - ".github/workflows/skill-instruction-integrity.yml"
  pull_request:
    paths:
      - "solkraft/skillpacks/**"
      - "scripts/audit_skill_instructions.py"
      - "tests/test_skill_instruction_integrity.py"
      - ".github/workflows/skill-instruction-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install "pytest>=8,<9"
      - name: Audit all bundled skill instructions
        run: python scripts/audit_skill_instructions.py
      - name: Run integrity test
        run: python -m pytest -q tests/test_skill_instruction_integrity.py
