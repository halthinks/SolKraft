name: Verify SolKraft
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q tests solkraft/skillpacks/solforge/tests
        env:
          SOLFORGE_TEST_ROOT: solkraft/skillpacks
      - run: node --check docs/assets/app.js
      - run: node --check docs/assets/flow.js
      - run: python scripts/package_plugin.py
