name: Debug Semantic Routing

on:
  push:
    branches: [debug-semantic-routing]

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Inspect benchmark-aligned semantic routing
        run: |
          python - <<'PY'
          from solkraft.catalog import SkillCatalog
          import solkraft.routing as routing
          from solkraft.routing import BUNDLE_ROOT, catalog_graph, contract_index, route_request
          from scripts.semantic_router_benchmark import build_profiles, single_prompt, composition_targets, composition_prompt, selectable_ids
          from solkraft.skillpacks.solforge.scripts import compose_route

          catalog=SkillCatalog([BUNDLE_ROOT], preferred_root=BUNDLE_ROOT)
          records=list(catalog.records())
          records_by_id={r.id:r for r in records}
          graph=catalog_graph(catalog)
          idx=contract_index(catalog)
          entries={e["id"]:e for e in idx.entries()}
          profiles=build_profiles(records,graph)
          selectable=selectable_ids(records,graph,entries)

          for sid,case in [("solforge-code-mastery",86),("solforge-prompt",86),("solforge-mvp-create",86)]:
              rec=records_by_id[sid]
              prompt=single_prompt(rec,profiles[sid],profiles,case)
              clauses,_=compose_route.segment(prompt)
              print("\nSINGLE",sid,"case",case)
              print("PROMPT",prompt)
              print("CLAUSES",clauses)
              for i,cl in enumerate(clauses,1):
                  print("RANK",i,routing._graph_identity_rank(graph,cl,limit=8))
              route=route_request(catalog,prompt,max_skills=50,policy={"contract_mode":"hardened"})
              print("SELECTED",route.get("selected"))
              print("SEM_ORDER",route.get("selection_trace",{}).get("semantic_clause_order"))
              print("SEM_RANK",route.get("selection_trace",{}).get("semantic_capability_rank"))

          for case_id in [6,22,38,54]:
              targets=composition_targets(selectable,case_id)
              prompt=composition_prompt(records_by_id,profiles,targets,case_id)
              clauses,_=compose_route.segment(prompt)
              print("\nCOMP",case_id,"TARGETS",targets)
              print("PROMPT",prompt)
              print("CLAUSES",clauses)
              for i,cl in enumerate(clauses,1):
                  print("RANK",i,routing._graph_identity_rank(graph,cl,limit=8))
              route=route_request(catalog,prompt,max_skills=50,policy={"contract_mode":"hardened"})
              print("SELECTED",route.get("selected"))
              print("SEM_ORDER",route.get("selection_trace",{}).get("semantic_clause_order"))
          PY

# trigger
