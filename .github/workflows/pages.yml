name: Deploy SolKraft Console to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "solkraft/**"
      - "scripts/build_console.py"
      - "scripts/package_plugin.py"
      - "plugins/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Generated console and plugin ZIP are built and verified locally before push.
      # This job uploads static files; it does not run the Python/UI build or tests.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
