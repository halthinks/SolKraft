[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solkraft"
version = "0.1.0"
description = "An open skill operating system with a callable REST API and MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SolKraft contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "mcp>=1.28,<2",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
solkraft = "solkraft.__main__:main"

[tool.setuptools.packages.find]
include = ["solkraft*"]

[tool.setuptools.package-data]
solkraft = ["skillpacks/**/*", "schemas/*.json", "retired-skills.json", "trust-bindings.json"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "__pycache__/*", "**/*.pyc", "*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
